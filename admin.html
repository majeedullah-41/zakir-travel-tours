<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0B2D5B">
    <title>Zakir Travel & Tours | Mobile Admin Portal</title>
    <!-- SEO: description + Open Graph / Twitter Card -->
    <meta name="description" content="Admin portal for Zakir Travel & Tours — manage Umrah packages, visas, work permits, deals and enquiries.">
    <meta name="robots" content="noindex, nofollow">
    <!-- Google Analytics (measurement ID already in js/firebase-config.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CRDXFTXY55"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-CRDXFTXY55');
    </script>
    <link rel="icon" type="image/png" href="./assets/logo-mark.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            DEFAULT: '#0B2D5B',
                            dark: '#05162E',
                            light: '#16437E'
                        },
                        teal: {
                            DEFAULT: '#0D8A9E',
                            dark: '#096979',
                            light: '#15B2CB',
                            accent: '#E6F6F8'
                        },
                        gold: {
                            DEFAULT: '#D4AF37',
                            light: '#FDE68A',
                            soft: '#FEF3C7'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif']
                    },
                    boxShadow: {
                        'executive': '0 24px 60px -15px rgba(5, 22, 46, 0.12)',
                        'card': '0 12px 32px -8px rgba(11, 45, 91, 0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        .admin-surface {
            background-color: #F4F8FB;
            background-image:
                radial-gradient(at 0% 0%, rgba(13, 138, 158, 0.06) 0px, transparent 45%),
                radial-gradient(at 100% 0%, rgba(212, 175, 55, 0.05) 0px, transparent 40%);
        }

        /* CSS Country Flags — same rules as work-permit.html, so the
           admin's flag previews match the website exactly. */
        .flag { display: inline-block; width: 22px; height: 15px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(11,45,91,0.18); flex-shrink: 0; }
        .flag-lg { width: 30px; height: 20px; }
        .flag-xl { width: 40px; height: 27px; border-radius: 5px; }
        .flag-pl { background: linear-gradient(to bottom, #fff 50%, #DC143C 50%); }
        .flag-ro { background: linear-gradient(to right, #002B7F 33.3%, #FCD116 33.3% 66.6%, #CE1126 66.6%); }
        .flag-hr { background: linear-gradient(to bottom, #FF0000 33.3%, #fff 33.3% 66.6%, #171796 66.6%); }
        .flag-hu { background: linear-gradient(to bottom, #CE2939 33.3%, #fff 33.3% 66.6%, #477050 66.6%); }
        .flag-cz { background: linear-gradient(to bottom right, #11457E 50%, transparent 50%) left bottom / 50% 50% no-repeat, linear-gradient(to top right, #11457E 50%, transparent 50%) left top / 50% 50% no-repeat, linear-gradient(to bottom, #fff 50%, #D7141A 50%); }
        .flag-pt { background: linear-gradient(to right, #006600 40%, #FF0000 40%); }
        .flag-mt { background: linear-gradient(to right, #fff 50%, #CF142B 50%); }
        .flag-eu { background: radial-gradient(circle at 50% 50%, #FFCC00 0 2px, transparent 2.5px), #003399; }
    </style>
</head>
<body class="font-sans admin-surface text-slate-800 antialiased selection:bg-teal selection:text-white">
    <div id="standaloneAdminRoot"></div>

    
    <!-- Firebase v10 Compat SDKs (Works on both file:// and https://) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <!-- Zakir Travel & Tours Database & Admin Portal Scripts -->
    <script src="./js/firebase-config.js"></script>
    <script src="./js/firebase-db.js"></script>
    <script src="./js/admin-portal.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var root = document.getElementById("standaloneAdminRoot");
            if (root && window.AdminPortalManager) {
                new window.AdminPortalManager(root, { isDrawer: false });
            }
        });
    </script>
</body>
</html>
